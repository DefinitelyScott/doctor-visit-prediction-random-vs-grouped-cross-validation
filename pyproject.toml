[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visit-leakage"
version = "0.1.0"
description = "How much does random CV overstate accuracy when one person fills several rows?"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Third-party deprecation noise from matplotlib/pyparsing and scipy's solver
# options; filtered so warnings raised by this project stay visible.
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore:.*deprecated - use.*",
    "ignore:Unknown solver options:scipy.optimize.OptimizeWarning",
    "ignore:Unknown solver options",
]
